<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Next Bus · Exit 4</title>
<meta name="description" content="Next bus from Outram Pk Stn Exit 4 to Connection One Tower 5">
<meta name="theme-color" content="#141413">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Next Bus">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
<style>
  :root {
    --bg: #f6f6f3; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e3e2dc;
    --run: #d6342c; --run-bg: #fde8e6; --fast: #b86e00; --fast-bg: #fdf1dc;
    --ok: #1f7a4d; --ok-bg: #e2f4ea; --accent: #2557d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --card: #1f1f1d; --text: #ecebe6; --muted: #9c9b95; --line: #33332f;
      --run: #ff6b61; --run-bg: #3a1e1c; --fast: #f2a93b; --fast-bg: #352a17;
      --ok: #4cc488; --ok-bg: #173126; --accent: #7c9cff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px 40px; }

  .where { color: var(--muted); font-size: 14px; margin: 4px 2px 10px; }
  .where b { color: var(--text); }

  .hero { border-radius: 22px; padding: 22px 22px 20px; background: var(--card); border: 2px solid var(--line); }
  .hero.run { background: var(--run-bg); border-color: var(--run); }
  .hero.fast { background: var(--fast-bg); border-color: var(--fast); }
  .hero.ok { background: var(--ok-bg); border-color: var(--ok); }
  .hero-top { display: flex; align-items: baseline; gap: 16px; }
  .hero .svc { font-size: 34px; font-weight: 800; padding: 2px 12px; border-radius: 12px;
    background: var(--text); color: var(--bg); line-height: 1.2; }
  .hero .count { font-size: 64px; font-weight: 800; letter-spacing: -2px; line-height: 1; font-variant-numeric: tabular-nums; }
  .hero .count small { font-size: 26px; letter-spacing: 0; font-weight: 700; margin-left: 4px; }
  .hero .at { margin-top: 10px; font-size: 17px; color: var(--muted); }
  .hero .at b { color: var(--text); }
  .advice { margin-top: 14px; font-size: 22px; font-weight: 800; }
  .hero.run .advice { color: var(--run); } .hero.fast .advice { color: var(--fast); } .hero.ok .advice { color: var(--ok); }
  .advice span { display: block; font-size: 14px; font-weight: 500; color: var(--muted); margin-top: 2px; }
  .warn { margin-top: 12px; font-size: 13px; color: var(--fast); font-weight: 600; }

  .then { margin-top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 4px 16px; }
  .then-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
  .then-row:first-child { border-top: 0; }
  .then-row .svc { font-weight: 800; font-size: 17px; min-width: 52px; text-align: center; padding: 3px 0;
    border-radius: 8px; background: var(--bg); }
  .then-row .t { flex: 1; } .then-row .t b { font-size: 18px; }
  .then-row .t span { color: var(--muted); }
  .tag { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; white-space: nowrap; }
  .tag.packed { color: var(--fast); border-color: var(--fast); }
  .missed { color: var(--muted); font-size: 13px; margin: 10px 4px 0; }

  .status { color: var(--muted); font-size: 13px; margin: 14px 4px 0; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .dot.stale { background: var(--run); }

  details { margin-top: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  summary { cursor: pointer; padding: 13px 16px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "Show"; color: var(--accent); font-weight: 500; }
  details[open] summary::after { content: "Hide"; }
  #map { height: 320px; border-top: 1px solid var(--line); background: var(--bg); }
  .set { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px 14px; font-size: 15px; }
  .set input { font: inherit; width: 72px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--text); }
  .hint { color: var(--muted); font-size: 13px; padding: 0 16px 14px; margin: 0; }

  .bus-pin { font: 700 12px system-ui, sans-serif; color: #fff; border-radius: 999px; padding: 2px 7px; white-space: nowrap;
    box-shadow: 0 1px 4px rgba(0,0,0,.35); border: 2px solid #fff; transform: translate(-50%, -50%); display: inline-block; }
  .bus-pin.run { background: var(--run); } .bus-pin.fast { background: var(--fast); } .bus-pin.ok { background: var(--ok); }
  .bus-pin.gone { background: #8a8a84; }
  .place-pin { font: 700 11px system-ui, sans-serif; color: #fff; background: #1d1d1b; border-radius: 6px; padding: 3px 6px;
    white-space: nowrap; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); transform: translate(-50%, -50%); display: inline-block; }
  .place-pin.mrt { background: #9e28b5; transform: translate(-50%, 70%); }
  .place-pin.dest { background: var(--accent); transform: translate(-50%, -150%); }
  .leaflet-container { font: inherit; }
  @media (prefers-color-scheme: dark) { .leaflet-tile-pane { filter: brightness(.6) contrast(1.1); } }
</style>
</head>
<body>
<main>
  <p class="where"><b>Outram Pk Stn Exit 4</b> → Connection One Tower 5</p>

  <section class="hero" id="hero" aria-live="polite"><div class="count">…</div></section>
  <div id="then"></div>
  <p class="missed" id="missed"></p>
  <p class="status" id="status"></p>

  <details id="mapBox">
    <summary>Where are the buses?</summary>
    <div id="map" role="img" aria-label="Map of the 147, 961 and 961M route from Outram Park Exit 4 with live bus positions"></div>
  </details>

  <details>
    <summary>Settings</summary>
    <label class="set" for="walk">Walk from train to Exit 4 stop (min)<input id="walk" type="number" min="0" max="30"></label>
    <p class="hint">The next bus shown is the first one you can still make after this walk.</p>
  </details>
</main>

<script>
// Services from Outram Pk Stn Exit 4 that stop within ~150 m of Tower 5 (see tools/find-routes.js).
const STOP = { code: "05069", services: ["147", "961", "961M"] };
const LOAD = { SDA: "standing", LSD: "packed" };

// Spare = minutes between reaching the stop at normal pace and the bus arriving.
const RUN_BELOW = 1, FAST_BELOW = 3, MISSED_BELOW = -1;
// If the bus you'd have to rush for is followed this closely by another, don't rush.
const NOT_WORTH_RUSHING = 4;

let walkMin = load("walkMin", 4);
let buses = [], fetchedAt = null, fetchError = null;

function load(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

const getJson = url => fetch(url).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
// arrivelah allows cross-origin calls, so this works as a static site (GitHub Pages);
// the local server's /api/arrivals proxy is only a fallback.
const getArrivals = code => getJson(`https://arrivelah2.busrouter.sg/?id=${code}`)
  .catch(() => getJson(`/api/arrivals?id=${code}`));

async function refresh() {
  try {
    const data = await getArrivals(STOP.code);
    buses = [];
    for (const svc of data.services || []) {
      if (!STOP.services.includes(svc.no)) continue;
      for (const b of [svc.next, svc.next2, svc.next3]) {
        if (b && b.time) buses.push({ svc: svc.no, t: new Date(b.time).getTime(), load: b.load,
          live: b.monitored === 1, lat: b.lat, lng: b.lng });
      }
    }
    buses.sort((a, b) => a.t - b.t);
    fetchedAt = Date.now(); fetchError = null;
  } catch (e) { fetchError = e.message || "network error"; }
  render();
}

function withPace(now = Date.now()) {
  return buses.map(b => {
    const inMin = (b.t - now) / 60000, spare = inMin - walkMin;
    const pace = spare < MISSED_BELOW ? "gone" : spare < RUN_BELOW ? "run" : spare < FAST_BELOW ? "fast" : "ok";
    return { ...b, inMin, spare, pace };
  }).filter(b => b.inMin > -0.5);
}

const fmt = t => new Date(t).toLocaleTimeString("en-SG", { hour: "2-digit", minute: "2-digit", hour12: false });
const mins = m => Math.max(0, Math.round(m));
const tags = b => (b.live ? "" : ' <span class="tag">timetable</span>') +
  (LOAD[b.load] ? ` <span class="tag ${b.load === "LSD" ? "packed" : ""}">${LOAD[b.load]}</span>` : "");

function countdown(m) {
  if (m < 1) return `${Math.max(0, Math.round(m * 60))}<small>sec</small>`;
  if (m < 2) { const s = Math.round(m * 60); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}<small>min</small>`; }
  return `${Math.round(m)}<small>min</small>`;
}

function render() {
  const all = withPace();
  const makeable = all.filter(b => b.pace !== "gone");
  const tooClose = all.filter(b => b.pace === "gone");
  const hero = document.getElementById("hero");

  if (!makeable.length) {
    hero.className = "hero";
    hero.innerHTML = fetchedAt || fetchError
      ? `<div class="advice">No buses right now<span>${fetchError ? "Couldn't reach the arrival service." : "Nothing in the arrival data for 147 / 961 / 961M."}</span></div>`
      : `<div class="count">…</div>`;
  } else {
    const next = makeable[0];
    const later = makeable.find(b => b.t > next.t && b.pace === "ok");
    let pace = next.pace, word, why;
    if (next.pace === "ok") {
      word = "Relax"; why = `${mins(next.spare)} min to spare after your ${walkMin} min walk`;
    } else if (later && (later.t - next.t) / 60000 <= NOT_WORTH_RUSHING) {
      pace = "ok"; word = "Don't rush";
      why = `${later.svc} comes ${mins((later.t - next.t) / 60000)} min after it, at ${fmt(later.t)}`;
    } else {
      word = next.pace === "run" ? "Run" : "Walk fast";
      why = later ? `Next easy one is ${mins((later.t - next.t) / 60000)} min later` : `Tight with your ${walkMin} min walk`;
    }
    hero.className = "hero " + pace;
    hero.innerHTML = `
      <div class="hero-top"><span class="svc">${next.svc}</span><span class="count">${countdown(next.inMin)}</span></div>
      <div class="at">Arrives <b>${fmt(next.t)}</b>${tags(next)}</div>
      <div class="advice">${word}<span>${why}</span></div>
      ${next.live ? "" : '<div class="warn">No GPS on this bus — time is from the timetable and may be off.</div>'}`;
  }

  const rest = makeable.slice(1, 4);
  document.getElementById("then").innerHTML = rest.length ? `<div class="then">${rest.map(b => `
    <div class="then-row"><span class="svc">${b.svc}</span>
      <span class="t"><b>${mins(b.inMin)} min</b> <span>· ${fmt(b.t)}</span></span>${tags(b)}</div>`).join("")}</div>` : "";

  document.getElementById("missed").textContent = tooClose.length
    ? `Too close to make: ${tooClose.map(b => `${b.svc} in ${mins(b.inMin)} min`).join(", ")}` : "";

  const age = fetchedAt ? Math.round((Date.now() - fetchedAt) / 1000) : null;
  const stale = fetchError || age > 60;
  document.getElementById("status").innerHTML = fetchedAt || fetchError
    ? `<span class="dot ${stale ? "stale" : ""}"></span>${fetchError ? `Can't refresh (${fetchError}) · ` : ""}${age !== null ? `Updated ${age}s ago` : ""}`
    : "";

  updateMap(all);
}

// ---- Map (built the first time it is opened) ----
let map = null, busLayer, lastSig = "";

async function initMap() {
  const trip = await getJson("trip-data.json");
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  map = L.map("map", { scrollWheelZoom: false });
  L.tileLayer("https://www.onemap.gov.sg/maps/tiles/Grey/{z}/{x}/{y}.png", {
    minZoom: 12, maxZoom: 19, detectRetina: true,
    attribution: '<a href="https://www.onemap.gov.sg/" target="_blank">OneMap</a> &copy; contributors | <a href="https://www.sla.gov.sg/" target="_blank">Singapore Land Authority</a>',
  }).addTo(map);

  const { mrt, dest } = trip.places;
  const dash = (a, b) => L.polyline([[a.lat, a.lng], [b.lat, b.lng]], { color: "#666", weight: 2, dashArray: "4 6" }).addTo(map);
  trip.board.forEach(b => dash(mrt, b));
  trip.alight.forEach(a => dash(a, dest));
  const lines = trip.lines.map(l => L.polyline(l.pts, { color: dark ? "#7c9cff" : "#2b7bd6", weight: 5, opacity: .9 })
    .bindTooltip(l.services.join(" · "), { sticky: true }).addTo(map));

  const pin = (p, cls, label) => L.marker([p.lat, p.lng], { interactive: false,
    icon: L.divIcon({ className: "", html: `<span class="place-pin ${cls}">${label}</span>`, iconSize: [0, 0] }) }).addTo(map);
  pin(mrt, "mrt", "Outram Park MRT");
  pin(dest, "dest", "Tower 5");
  for (const s of trip.board) L.circleMarker([s.lat, s.lng], { radius: 8, weight: 3, color: "#2b7bd6", fillColor: "#fff", fillOpacity: 1 })
    .bindTooltip("Exit 4", { permanent: true, direction: "left", offset: [-8, 0] }).addTo(map);

  busLayer = L.layerGroup().addTo(map);
  // Route plus the next two buses with GPS, so you can see them coming.
  const bounds = L.featureGroup(lines).getBounds().extend([mrt.lat, mrt.lng]).extend([dest.lat, dest.lng]);
  withPace().filter(b => b.live && b.lat && b.pace !== "gone").slice(0, 2).forEach(b => bounds.extend([b.lat, b.lng]));
  map.fitBounds(bounds, { padding: [30, 30], maxZoom: 16 });
  render();
}

function updateMap(all) {
  if (!map) return;
  const live = all.filter(b => b.live && b.lat);
  const sig = live.map(b => [b.svc, b.pace, mins(b.inMin), b.lat, b.lng].join()).join("|");
  if (sig === lastSig) return;
  lastSig = sig;
  busLayer.clearLayers();
  for (const b of live) L.marker([b.lat, b.lng], { interactive: false, icon: L.divIcon({ className: "", iconSize: [0, 0],
    html: `<span class="bus-pin ${b.pace}">${b.svc} · ${mins(b.inMin)}m</span>` }) }).addTo(busLayer);
}

document.getElementById("mapBox").addEventListener("toggle", e => {
  if (!e.target.open) return;
  if (!map && window.L) initMap().catch(() => document.getElementById("map").textContent = "Map unavailable.");
  else if (map) map.invalidateSize();
});

const walkInput = document.getElementById("walk");
walkInput.value = walkMin;
walkInput.addEventListener("input", () => { walkMin = Math.max(0, +walkInput.value || 0); save("walkMin", walkMin); render(); });

// Refresh when you come back to the app, not just on the timer.
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });

refresh();
setInterval(refresh, 20000);
setInterval(render, 1000);
</script>
</body>
</html>
