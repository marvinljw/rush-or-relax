<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Next Bus</title>
<meta name="description" content="Next bus between Outram Park and Connection One Tower 5, and when to leave home">
<meta name="theme-color" content="#141413">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Next Bus">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
<style>
  :root {
    --bg: #f6f6f3; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e3e2dc;
    --run: #d6342c; --run-bg: #fde8e6; --fast: #b86e00; --fast-bg: #fdf1dc;
    --ok: #1f7a4d; --ok-bg: #e2f4ea; --accent: #2557d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --card: #1f1f1d; --text: #ecebe6; --muted: #9c9b95; --line: #33332f;
      --run: #ff6b61; --run-bg: #3a1e1c; --fast: #f2a93b; --fast-bg: #352a17;
      --ok: #4cc488; --ok-bg: #173126; --accent: #7c9cff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px 40px; }

  .dirs { display: flex; gap: 6px; margin: 0 0 8px; }
  .dirs button { font: inherit; font-size: 14px; font-weight: 600; border: 1px solid var(--line); background: none; color: var(--muted);
    padding: 6px 14px; border-radius: 999px; cursor: pointer; }
  .dirs button[aria-selected="true"] { border-color: var(--text); color: var(--text); }
  .dirs .auto { font-size: 11px; font-weight: 500; color: var(--muted); margin-left: 6px; }
  .where { color: var(--muted); font-size: 14px; margin: 4px 2px 10px; }
  .where b { color: var(--text); }

  .hero { border-radius: 22px; padding: 22px 22px 20px; background: var(--card); border: 2px solid var(--line); }
  .hero.soon { background: var(--run-bg); border-color: var(--run); }
  .hero.fast { background: var(--fast-bg); border-color: var(--fast); }
  .hero.ok { background: var(--ok-bg); border-color: var(--ok); }
  .hero-top { display: flex; align-items: baseline; gap: 16px; }
  .hero .svc { font-size: 34px; font-weight: 800; padding: 2px 12px; border-radius: 12px;
    background: var(--text); color: var(--bg); line-height: 1.2; }
  .hero .count { font-size: 64px; font-weight: 800; letter-spacing: -2px; line-height: 1; font-variant-numeric: tabular-nums; }
  .hero .count small { font-size: 26px; letter-spacing: 0; font-weight: 700; margin-left: 4px; }
  .hero .at { margin-top: 10px; font-size: 17px; color: var(--muted); }
  .hero .at b { color: var(--text); }
  .advice { margin-top: 14px; font-size: 22px; font-weight: 800; }
  .hero.run .advice { color: var(--run); } .hero.fast .advice { color: var(--fast); } .hero.ok .advice { color: var(--ok); }
  .advice span { display: block; font-size: 14px; font-weight: 500; color: var(--muted); margin-top: 2px; }
  .warn { margin-top: 12px; font-size: 13px; color: var(--fast); font-weight: 600; }

  .then { margin-top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 4px 16px; }
  .then-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
  .then-row:first-child { border-top: 0; }
  .then-row .svc { font-weight: 800; font-size: 17px; min-width: 52px; text-align: center; padding: 3px 0;
    border-radius: 8px; background: var(--bg); }
  .then-row .t { flex: 1; } .then-row .t b { font-size: 18px; }
  .then-row .t span { color: var(--muted); }
  .tag { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; white-space: nowrap; }
  .tag.packed { color: var(--fast); border-color: var(--fast); }

  .status { color: var(--muted); font-size: 13px; margin: 14px 4px 0; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .dot.stale { background: var(--run); }

  details { margin-top: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  summary { cursor: pointer; padding: 13px 16px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "Show"; color: var(--accent); font-weight: 500; }
  details[open] summary::after { content: "Hide"; }
  #map { height: 320px; border-top: 1px solid var(--line); background: var(--bg); }
  .set { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px 14px; font-size: 15px; }
  .set input { font: inherit; width: 72px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--text); }
  .hint { color: var(--muted); font-size: 13px; padding: 0 16px 14px; margin: 0; }

  .tabs { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px; margin-bottom: 14px; }
  .tabs button { flex: 1; font: inherit; font-weight: 600; border: 0; background: none; color: var(--muted); padding: 8px; border-radius: 999px; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--text); color: var(--bg); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
  .trip { padding: 4px 16px 14px; }
  .row-edit { border: 0; margin: 0; border-radius: 0; background: none; overflow: visible; }
  .row-edit summary, .row-edit.to { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .row-edit summary::after { content: "Change"; font-size: 14px; }
  .row-edit summary { padding-left: 0; padding-right: 0; }
  .lbl { color: var(--muted); font-size: 13px; min-width: 64px; }
  .place { flex: 1; display: flex; flex-direction: column; }
  .place span { color: var(--muted); font-size: 13px; }
  .row-edit.to { border-bottom: 0; padding-bottom: 6px; }
  .searchbox input { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); }
  .row-edit .searchbox { padding: 10px 0; }
  .results { display: flex; flex-direction: column; }
  .pick { text-align: left; font: inherit; background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--text); padding: 9px 4px; cursor: pointer; }
  .pick span { display: block; color: var(--muted); font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 999px; padding: 5px 11px; cursor: pointer; }
  .arrive { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .arrive input { font: inherit; font-size: 20px; font-weight: 700; padding: 4px 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); }
  .daynote { color: var(--muted); font-size: 13px; }

  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .tile { border-radius: 18px; padding: 14px 16px; border: 2px solid var(--line); background: var(--card); }
  .tile.bus { border-color: var(--ok); background: var(--ok-bg); }
  .tile.taxi { border-color: var(--fast); background: var(--fast-bg); }
  .tile .k { font-size: 13px; color: var(--muted); font-weight: 600; }
  .tile .v { font-size: 38px; font-weight: 800; letter-spacing: -1px; line-height: 1.1; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .tile .s { font-size: 14px; font-weight: 600; }
  .tile .n { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .late { color: var(--run); }
  .livebox { margin: 10px 0 0; padding: 10px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--ok); font-size: 14px; }
  .livebox.late { border-color: var(--run); }
  #planOut h3 { font-size: 15px; margin: 20px 4px 8px; color: var(--muted); }
  .opt { margin-top: 8px; }
  .opt summary { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: center; }
  .opt summary::after { display: none; }
  .opt .when { font-weight: 800; font-size: 17px; }
  .opt .what { text-align: right; }
  .opt .dur { grid-column: 1 / -1; color: var(--muted); font-size: 13px; font-weight: 500; }
  .no { display: inline-block; font-weight: 800; background: var(--text); color: var(--bg); border-radius: 6px; padding: 0 6px; font-size: 14px; }
  .opt ol { margin: 0; padding: 4px 16px 14px 36px; font-size: 14px; }
  .opt li { padding: 5px 0; }
  .opt li.walk { color: var(--muted); }
  .opt li .sub { display: block; color: var(--muted); font-size: 13px; }
  .taxi { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 4px 16px; font-size: 15px; }
  .taxi .sub { color: var(--muted); font-size: 13px; margin-top: -6px; }
  .pad { padding: 16px 4px; }

  .bus-pin { font: 700 12px system-ui, sans-serif; color: #fff; border-radius: 999px; padding: 2px 7px; white-space: nowrap;
    box-shadow: 0 1px 4px rgba(0,0,0,.35); border: 2px solid #fff; transform: translate(-50%, -50%); display: inline-block; }
  .bus-pin { background: var(--accent); }
  .place-pin { font: 700 11px system-ui, sans-serif; color: #fff; background: #1d1d1b; border-radius: 6px; padding: 3px 6px;
    white-space: nowrap; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); transform: translate(-50%, -50%); display: inline-block; }
  .place-pin.mrt { background: #9e28b5; transform: translate(-50%, 70%); }
  .place-pin.dest { background: var(--accent); transform: translate(-50%, -150%); }
  .leaflet-container { font: inherit; }
  @media (prefers-color-scheme: dark) { .leaflet-tile-pane { filter: brightness(.6) contrast(1.1); } }
</style>
</head>
<body>
<main>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tabbtn-next" data-tab="next">Next bus</button>
    <button role="tab" id="tabbtn-plan" data-tab="plan">Plan a trip</button>
  </nav>

  <section id="tab-next">
  <div class="dirs" role="tablist" aria-label="Direction">
    <button role="tab" data-dir="go">Going to work</button>
    <button role="tab" data-dir="back">Coming back</button>
  </div>
  <p class="where" id="where"></p>

  <section class="hero" id="hero" aria-live="polite"><div class="count">…</div></section>
  <div id="then"></div>
  <p class="status" id="status"></p>

  <details id="mapBox">
    <summary>Where are the buses?</summary>
    <div id="map" role="img" aria-label="Map of the bus route with live bus positions"></div>
  </details>

  </section>

  <section id="tab-plan" hidden>
    <div class="card trip">
      <details id="homeEdit" class="row-edit">
        <summary><span class="lbl">From</span><span class="place"><b id="homeLabel"></b><span id="homeSub"></span></span></summary>
        <div class="searchbox"><input id="homeSearch" type="search" placeholder="Search home address or postal code" autocomplete="off"><div id="homeResults" class="results"></div></div>
      </details>
      <div class="row-edit to">
        <span class="lbl">To</span><span class="place"><b id="destLabel"></b><span id="destSub"></span></span>
      </div>
      <div class="searchbox"><input id="destSearch" type="search" placeholder="Search a place, building or postal code" autocomplete="off"><div id="destResults" class="results"></div></div>
      <div class="chips" id="recents"></div>
      <label class="arrive"><span class="lbl">Arrive by</span><input id="arriveBy" type="time"><span id="dayNote" class="daynote"></span></label>
    </div>
    <div id="planOut"></div>
    <details>
      <summary>Planning settings</summary>
      <label class="set" for="early">Arrive early by (min)<input id="early" type="number" min="0" max="60"></label>
      <label class="set" for="busWait">Allow for waiting per bus (min)<input id="busWait" type="number" min="0" max="30"></label>
      <label class="set" for="taxiWait">Time for a taxi to reach you (min)<input id="taxiWait" type="number" min="0" max="60"></label>
    </details>
  </section>
</main>
<script src="planner.js"></script>
<script src="plan.js"></script>

<script>
// Buses between Outram Park MRT and Connection One Tower 5 (see tools/find-routes.js).
const DIRS = {
  go: { code: "05069", services: ["147", "961", "961M"], from: "Outram Pk Stn Exit 4", to: "Connection One Tower 5",
    stopTip: "Exit 4" },
  back: { code: "10099", services: ["147", "197", "961", "961M"], from: "Opp Bt Merah Town Ctr", to: "Outram Pk Stn Exit 6 (MRT)",
    stopTip: "Opp Bt Merah Town Ctr" },
};
// Before 2pm you're heading to work; after, heading home. A tap overrides it until the app is reopened.
const autoDir = () => new Date().getHours() < 14 ? "go" : "back";
let dirKey = autoDir(), dirManual = false;
let STOP = DIRS[dirKey];
const LOAD = { SDA: "standing", LSD: "packed" };

let buses = [], fetchedAt = null, fetchError = null;

function load(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

const getJson = url => fetch(url).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
// arrivelah allows cross-origin calls, so this works as a static site (GitHub Pages);
// the local server's /api/arrivals proxy is only a fallback.
const getArrivals = code => getJson(`https://arrivelah2.busrouter.sg/?id=${code}`)
  .catch(() => getJson(`/api/arrivals?id=${code}`));

async function refresh() {
  try {
    const want = STOP;
    const data = await getArrivals(want.code);
    if (want !== STOP) return;   // direction changed while loading
    buses = [];
    for (const svc of data.services || []) {
      if (!STOP.services.includes(svc.no)) continue;
      for (const b of [svc.next, svc.next2, svc.next3]) {
        if (b && b.time) buses.push({ svc: svc.no, t: new Date(b.time).getTime(), load: b.load,
          live: b.monitored === 1, lat: b.lat, lng: b.lng });
      }
    }
    buses.sort((a, b) => a.t - b.t);
    fetchedAt = Date.now(); fetchError = null;
  } catch (e) { fetchError = e.message || "network error"; }
  render();
}

// Buses still to come, in arrival order (a bus stays listed until ~30s after its time).
function upcoming(now = Date.now()) {
  return buses.map(b => ({ ...b, inMin: (b.t - now) / 60000 })).filter(b => b.inMin > -0.5);
}

const fmt = t => new Date(t).toLocaleTimeString("en-SG", { hour: "2-digit", minute: "2-digit", hour12: false });
const mins = m => Math.max(0, Math.round(m));
const tags = b => (b.live ? "" : ' <span class="tag">timetable</span>') +
  (LOAD[b.load] ? ` <span class="tag ${b.load === "LSD" ? "packed" : ""}">${LOAD[b.load]}</span>` : "");

function countdown(m) {
  if (m < 0.25) return "Arriving";
  if (m < 1) return `${Math.round(m * 60)}<small>sec</small>`;
  if (m < 2) { const s = Math.round(m * 60); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}<small>min</small>`; }
  return `${Math.round(m)}<small>min</small>`;
}

function render() {
  const all = upcoming();
  const hero = document.getElementById("hero");

  if (!all.length) {
    hero.className = "hero";
    hero.innerHTML = fetchedAt || fetchError
      ? `<div class="advice">No buses right now<span>${fetchError ? "Couldn't reach the arrival service." : `Nothing in the arrival data for ${STOP.services.join(" / ")}.`}</span></div>`
      : `<div class="count">…</div>`;
  } else {
    const next = all[0];
    hero.className = "hero" + (next.inMin < 1 ? " soon" : "");
    hero.innerHTML = `
      <div class="hero-top"><span class="svc">${next.svc}</span><span class="count">${countdown(next.inMin)}</span></div>
      <div class="at">Arrives <b>${fmt(next.t)}</b>${tags(next)}</div>
      ${next.live ? "" : '<div class="warn">No GPS on this bus — time is from the timetable and may be off.</div>'}`;
  }

  const rest = all.slice(1, 5);
  document.getElementById("then").innerHTML = rest.length ? `<div class="then">${rest.map(b => `
    <div class="then-row"><span class="svc">${b.svc}</span>
      <span class="t"><b>${mins(b.inMin)} min</b> <span>· ${fmt(b.t)}</span></span>${tags(b)}</div>`).join("")}</div>` : "";

  const age = fetchedAt ? Math.round((Date.now() - fetchedAt) / 1000) : null;
  const stale = fetchError || age > 60;
  document.getElementById("status").innerHTML = fetchedAt || fetchError
    ? `<span class="dot ${stale ? "stale" : ""}"></span>${fetchError ? `Can't refresh (${fetchError}) · ` : ""}${age !== null ? `Updated ${age}s ago` : ""}`
    : "";

  updateMap(all);
}

// ---- Map (built the first time it is opened) ----
let map = null, busLayer, tripLayer, trip = null, lastSig = "";

async function initMap() {
  trip = await getJson("trip-data.json");
  map = L.map("map", { scrollWheelZoom: false });
  L.tileLayer("https://www.onemap.gov.sg/maps/tiles/Grey/{z}/{x}/{y}.png", {
    minZoom: 12, maxZoom: 19, detectRetina: true,
    attribution: '<a href="https://www.onemap.gov.sg/" target="_blank">OneMap</a> &copy; contributors | <a href="https://www.sla.gov.sg/" target="_blank">Singapore Land Authority</a>',
  }).addTo(map);

  const { mrt, dest } = trip.places;
  const pin = (p, cls, label) => L.marker([p.lat, p.lng], { interactive: false,
    icon: L.divIcon({ className: "", html: `<span class="place-pin ${cls}">${label}</span>`, iconSize: [0, 0] }) }).addTo(map);
  pin(mrt, "mrt", "Outram Park MRT");
  pin(dest, "dest", "Tower 5");
  tripLayer = L.layerGroup().addTo(map);
  busLayer = L.layerGroup().addTo(map);
  drawTrip();
}

// The route for the current direction, zoomed to it plus the next two buses with GPS.
function drawTrip() {
  if (!map || !trip) return;
  const d = trip.directions[dirKey], from = trip.places[d.start], to = trip.places[d.end];
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  tripLayer.clearLayers();
  const dash = (a, b) => L.polyline([[a.lat, a.lng], [b.lat, b.lng]], { color: "#666", weight: 2, dashArray: "4 6" }).addTo(tripLayer);
  dash(from, d.board); dash(d.alight, to);
  const line = L.polyline(d.line.pts, { color: dark ? "#7c9cff" : "#2b7bd6", weight: 5, opacity: .9 })
    .bindTooltip(STOP.services.join(" · "), { sticky: true }).addTo(tripLayer);
  L.circleMarker([d.board.lat, d.board.lng], { radius: 8, weight: 3, color: "#2b7bd6", fillColor: "#fff", fillOpacity: 1 })
    .bindTooltip(STOP.stopTip, { permanent: true, direction: "left", offset: [-8, 0] }).addTo(tripLayer);
  const bounds = line.getBounds().extend([from.lat, from.lng]).extend([to.lat, to.lng]);
  upcoming().filter(b => b.live && b.lat).slice(0, 2).forEach(b => bounds.extend([b.lat, b.lng]));
  map.fitBounds(bounds, { padding: [30, 30], maxZoom: 16 });
  lastSig = "";
  render();
}

function updateMap(all) {
  if (!map) return;
  const live = all.filter(b => b.live && b.lat);
  const sig = live.map(b => [b.svc, mins(b.inMin), b.lat, b.lng].join()).join("|");
  if (sig === lastSig) return;
  lastSig = sig;
  busLayer.clearLayers();
  for (const b of live) L.marker([b.lat, b.lng], { interactive: false, icon: L.divIcon({ className: "", iconSize: [0, 0],
    html: `<span class="bus-pin">${b.svc} · ${mins(b.inMin)}m</span>` }) }).addTo(busLayer);
}

document.getElementById("mapBox").addEventListener("toggle", e => {
  if (!e.target.open) return;
  if (!map && window.L) initMap().catch(() => document.getElementById("map").textContent = "Map unavailable.");
  else if (map) map.invalidateSize();
});


// ---- Direction ----
function setDir(key, manual) {
  const changed = key !== dirKey;
  dirKey = key; STOP = DIRS[key];
  if (manual) dirManual = true;
  document.getElementById("where").innerHTML = `<b>${STOP.from}</b> → ${STOP.to}`;
  document.querySelectorAll(".dirs button").forEach(b => {
    b.setAttribute("aria-selected", b.dataset.dir === key);
    b.innerHTML = (b.dataset.dir === "go" ? "Going to work" : "Coming back") +
      (b.dataset.dir === key && !dirManual ? '<span class="auto">auto</span>' : "");
  });
  if (changed) { buses = []; fetchedAt = null; fetchError = null; render(); refresh(); drawTrip(); }
}
document.querySelectorAll(".dirs button").forEach(b => b.onclick = () => setDir(b.dataset.dir, true));
setDir(dirKey);
// Follow the clock (e.g. app left open past 2pm) unless you picked a direction yourself.
setInterval(() => { if (!dirManual && autoDir() !== dirKey) setDir(autoDir()); }, 60000);

// Refresh when you come back to the app, not just on the timer.
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  if (!dirManual && autoDir() !== dirKey) setDir(autoDir()); else refresh();
});

// ---- Tabs ----
function showTab(name) {
  for (const t of ["next", "plan"]) {
    document.getElementById("tab-" + t).hidden = t !== name;
    document.getElementById("tabbtn-" + t).setAttribute("aria-selected", t === name);
  }
  try { localStorage.setItem("tab", name); } catch {}
  if (name === "plan") PlanTab.open();
  else if (map) map.invalidateSize();
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => showTab(b.dataset.tab));
showTab(location.hash === "#plan" ? "plan" : (() => { try { return localStorage.getItem("tab"); } catch {} })() || "next");

refresh();
setInterval(refresh, 20000);
setInterval(render, 1000);
</script>
</body>
</html>
